<!DOCTYPE html>
<html>
<head><title>New Course: Attendance Chimp</title></head>
<body style="text-align:center; font-family: Arial;">
<h1>Create Course</h1>
<form action="/app/createCourse" method="POST">
    {% csrf_token %}
    <p><label>Course Name: <input type="text" name="course_name"></label></p>
    <p><label>Meeting Days: <input type="text" name="meeting_days"></label></p>
    <p><label>Meeting Time: <input type="text" name="meeting_time"></label></p>
    <p><button type="submit">Create Course</button></p>
</form>
</body>
</html>

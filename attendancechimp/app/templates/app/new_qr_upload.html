<!DOCTYPE html>
<html>
<head><title>New QR Upload: Attendance Chimp</title></head>
<body style="text-align:center; font-family: Arial;">
<h1>Upload QR Code</h1>
<form action="/app/createQRCodeUpload" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <p><label>Lecture ID: <input type="text" name="lecture_id"></label></p>
    <p><label>Image: <input type="file" name="image"></label></p>
    <p><button type="submit">Upload</button></p>
</form>
</body>
</html>
